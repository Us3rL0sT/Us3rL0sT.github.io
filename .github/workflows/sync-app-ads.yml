name: Sync app-ads.txt and deploy Pages

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app-ads.txt
      - app-ads-custom.txt
      - scripts/sync_app_ads.py
      - .github/workflows/sync-app-ads.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app-ads-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and merge CAS entries
        run: python3 scripts/sync_app_ads.py
      - name: Save changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- app-ads.txt; then
            git add app-ads.txt
            git commit -m 'Update CAS app-ads.txt'
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            # Keep scheduled workflows active during long periods without CAS updates.
            git commit --allow-empty -m 'Keep app-ads synchronization active'
            git push
          fi
      - name: Prepare public file
        run: |
          mkdir -p _site
          cp app-ads.txt _site/app-ads.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
